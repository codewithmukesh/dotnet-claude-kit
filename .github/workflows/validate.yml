name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate-skills:
    name: Validate Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate skill frontmatter schema
        # Accepts the optional disable-model-invocation field (boolean).
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --user --quiet pyyaml
          python3 .github/scripts/check_frontmatter.py skills

      - name: Check SKILL.md structure and line budgets
        run: |
          errors=0
          for skill in skills/*/SKILL.md; do
            # Check YAML frontmatter exists
            if ! head -1 "$skill" | grep -q "^---$"; then
              echo "ERROR: $skill missing YAML frontmatter"
              errors=$((errors + 1))
            fi

            # Check required fields
            if ! grep -q "^name:" "$skill"; then
              echo "ERROR: $skill missing 'name' in frontmatter"
              errors=$((errors + 1))
            fi
            if ! grep -q "^description:" "$skill"; then
              echo "ERROR: $skill missing 'description' in frontmatter"
              errors=$((errors + 1))
            fi

            # Check line count (max 400)
            lines=$(wc -l < "$skill")
            if [ "$lines" -gt 400 ]; then
              echo "ERROR: $skill has $lines lines (max 400)"
              errors=$((errors + 1))
            fi

            # Workflow/orchestrator skills (What/When/How structure) have a tighter budget
            if grep -qx "## What" "$skill"; then
              if [ "$lines" -gt 200 ]; then
                echo "ERROR: $skill is a workflow skill with $lines lines (max 200)"
                errors=$((errors + 1))
              fi
              for section in "What" "When" "How"; do
                if ! grep -q "## $section" "$skill"; then
                  echo "WARNING: $skill missing '## $section' section"
                fi
              done
            else
              # Knowledge skills use the standard section set
              for section in "Core Principles" "Patterns" "Anti-patterns" "Decision Guide"; do
                if ! grep -q "## $section" "$skill"; then
                  echo "WARNING: $skill missing '## $section' section"
                fi
              done
            fi
          done

          if [ $errors -gt 0 ]; then
            echo "$errors error(s) found"
            exit 1
          fi
          echo "All skills validated successfully"

  validate-rules:
    name: Validate Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check rule frontmatter and size
        run: |
          errors=0
          if [ ! -d ".claude/rules" ] && [ ! -d "rules" ]; then
            echo "WARNING: No rules directory found"
            exit 0
          fi
          for rule in $(find .claude/rules rules -name "*.md" -type f 2>/dev/null); do
            # Check YAML frontmatter exists
            if ! head -1 "$rule" | grep -q "^---$"; then
              echo "ERROR: $rule missing YAML frontmatter"
              errors=$((errors + 1))
            fi

            # Check alwaysApply: true
            if ! grep -q "^alwaysApply: true" "$rule"; then
              echo "ERROR: $rule missing 'alwaysApply: true' in frontmatter"
              errors=$((errors + 1))
            fi

            # Check line count (max 100)
            lines=$(wc -l < "$rule")
            if [ "$lines" -gt 100 ]; then
              echo "ERROR: $rule has $lines lines (max 100)"
              errors=$((errors + 1))
            fi
          done

          if [ $errors -gt 0 ]; then
            echo "$errors error(s) found"
            exit 1
          fi
          count=$(find .claude/rules rules -name "*.md" -type f 2>/dev/null | wc -l)
          echo "All $count rules validated successfully"

  validate-agents:
    name: Validate Agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate agent frontmatter schema
        # Required: name, description. Optional: model, memory, tools,
        # disallowedTools, isolation, maxTurns, effort, color.
        # Forbidden (reserved for user/project-level agents): permissionMode,
        # hooks, mcpServers. Model must be a tier alias, never a pinned ID.
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --user --quiet pyyaml
          python3 .github/scripts/check_frontmatter.py agents

      - name: Check agent structure
        run: |
          errors=0
          for agent in agents/*.md; do
            # Check required sections
            for section in "Role Definition" "Skill Dependencies" "MCP Tool Usage" "Boundaries"; do
              if ! grep -q "## $section" "$agent"; then
                echo "ERROR: $agent missing '## $section' section"
                errors=$((errors + 1))
              fi
            done

            # Skill Dependencies list items must reference existing skills (FAIL on miss)
            while IFS= read -r skill; do
              if [ ! -f "skills/$skill/SKILL.md" ]; then
                echo "ERROR: $agent lists skill '$skill' in Skill Dependencies but skills/$skill/SKILL.md not found"
                errors=$((errors + 1))
              fi
            done < <(awk '/^## Skill Dependencies/{s=1; next} s && /^## /{exit} s' "$agent" \
              | grep -oE '^[[:space:]]*([0-9]+\.|-)[[:space:]]+`[a-z0-9][a-z0-9-]*`' \
              | grep -oE '`[a-z0-9-]+`' | tr -d '`' | sort -u)
          done

          if [ $errors -gt 0 ]; then
            echo "$errors error(s) found"
            exit 1
          fi
          count=$(ls agents/*.md 2>/dev/null | wc -l)
          echo "All $count agents validated successfully"

  validate-cross-references:
    name: Validate Cross-References
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check skill references resolve
        run: |
          errors=0
          # Check skills reference existing skills (FAIL on unresolved reference)
          for skill_file in skills/*/SKILL.md; do
            while IFS= read -r skill; do
              if [ ! -f "skills/$skill/SKILL.md" ]; then
                echo "ERROR: $skill_file references skill '$skill' — not found"
                errors=$((errors + 1))
              fi
            done < <(grep -oP 'skills/[\w-]+' "$skill_file" 2>/dev/null | sed 's|skills/||' | sort -u)
          done

          # Check AGENTS.md references existing skills and agents
          while IFS= read -r agent_file; do
            if [ ! -f "$agent_file" ]; then
              echo "ERROR: AGENTS.md references '$agent_file' but it does not exist"
              errors=$((errors + 1))
            fi
          done < <(grep -oP 'agents/[\w-]+\.md' AGENTS.md 2>/dev/null | sort -u)

          if [ $errors -gt 0 ]; then
            echo "$errors error(s) found"
            exit 1
          fi
          echo "Cross-references validated"

  validate-hooks:
    name: Validate Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check hook scripts exist and are valid
        run: |
          errors=0
          # Extract script paths from hooks.json
          scripts=$(python3 << 'PYEOF'
          import json, re
          d = json.load(open('hooks/hooks.json'))
          for event, entries in d.get('hooks', {}).items():
              for entry in entries:
                  for hook in entry.get('hooks', []):
                      cmd = hook.get('command', '')
                      clean = cmd.replace('${CLAUDE_PLUGIN_ROOT}/', '')
                      for match in re.findall(r'[\w][\w/.-]*\.sh', clean):
                          print(match)
          PYEOF
          )

          for script in $scripts; do
            if [ ! -f "$script" ]; then
              echo "ERROR: hooks.json references '$script' but it does not exist"
              errors=$((errors + 1))
            else
              echo "OK: $script"
              # Basic syntax check
              if command -v bash > /dev/null; then
                if ! bash -n "$script" 2>/dev/null; then
                  echo "ERROR: $script has syntax errors"
                  errors=$((errors + 1))
                fi
              fi
            fi
          done

          if [ $errors -gt 0 ]; then
            echo "$errors error(s) found"
            exit 1
          fi
          echo "All hook scripts validated"

      - name: Shellcheck hook scripts
        # Severity warning+ keeps style/info noise out. SC1090/SC1091 excluded:
        # dynamically sourced paths cannot be followed in CI.
        run: |
          shellcheck --version
          shellcheck --severity=warning --exclude=SC1090,SC1091 hooks/*.sh .github/scripts/*.sh
          echo "shellcheck passed"

  test-hooks-windows:
    name: Hook Scripts (Windows Git Bash)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Run hook behavior tests
        # Pipes realistic PreToolUse/PostToolUse JSON payloads (including
        # Windows backslash paths) through the hooks under Git Bash and
        # asserts intended exit codes, stderr reporting, and termination
        # within a timeout (no drive-root walk hangs, no over-blocking).
        run: bash .github/scripts/test-hooks.sh

  validate-consistency:
    name: Docs, Parity & Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Docs count consistency
        # Counts actual skills, workflow (slash-command) skills, agents, rules,
        # templates, and [McpServerTool] occurrences, then verifies every
        # numeric claim in README.md, plugin.json, marketplace.json, and
        # docs/shorthand-guide.md matches. Fails on any mismatch.
        run: python3 .github/scripts/check_docs_consistency.py

      - name: Cross-tool rule parity
        # Every rule file must be mentioned in the .codex and .opencode
        # AGENTS.md rule listings so all three tools stay in sync.
        run: |
          errors=0
          rules=$(find .claude/rules rules -name '*.md' -type f 2>/dev/null | sort -u)
          if [ -z "$rules" ]; then
            echo "ERROR: no rule files found"
            exit 1
          fi
          for doc in .codex/AGENTS.md .opencode/AGENTS.md; do
            if [ ! -f "$doc" ]; then
              echo "ERROR: $doc does not exist"
              errors=$((errors + 1))
              continue
            fi
            missing=""
            for rule in $rules; do
              base=$(basename "$rule")
              if ! grep -qF "$base" "$doc"; then
                missing="$missing $base"
              fi
            done
            if [ -n "$missing" ]; then
              echo "ERROR: $doc is missing rule(s):$missing"
              errors=$((errors + 1))
            else
              echo "OK: $doc lists all rules"
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "$errors parity error(s) found"
            exit 1
          fi
          echo "Cross-tool rule parity validated"

      - name: Version consistency
        # plugin.json version == marketplace.json version == newest CHANGELOG entry.
        run: |
          python3 - << 'PYEOF'
          import json, re, sys

          plugin = json.load(open(".claude-plugin/plugin.json"))["version"]
          marketplace = json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["version"]
          match = re.search(r"^##\s+\[(\d+\.\d+\.\d+)\]", open("CHANGELOG.md", encoding="utf-8").read(), re.M)
          if match is None:
              print("ERROR: no '## [x.y.z]' entry found in CHANGELOG.md")
              sys.exit(1)
          changelog = match.group(1)

          print(f"plugin.json      : {plugin}")
          print(f"marketplace.json : {marketplace}")
          print(f"CHANGELOG.md     : {changelog}")
          if not (plugin == marketplace == changelog):
              print("ERROR: version mismatch between plugin.json, marketplace.json, and CHANGELOG.md")
              sys.exit(1)
          print("Versions are consistent")
          PYEOF

  validate-plugin:
    name: Validate Plugin Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate JSON syntax
        run: |
          errors=0
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json .mcp.json hooks/hooks.json; do
            if ! python3 -m json.tool "$f" > /dev/null 2>&1; then
              echo "ERROR: $f is not valid JSON"
              errors=$((errors + 1))
            else
              echo "OK: $f"
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "$errors JSON error(s) found"
            exit 1
          fi

      - name: Validate plugin.json required keys
        run: |
          errors=0
          for key in name description; do
            if ! python3 -c "import json,sys; d=json.load(open('.claude-plugin/plugin.json')); assert '$key' in d" 2>/dev/null; then
              echo "ERROR: plugin.json missing required key '$key'"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            exit 1
          fi
          echo "plugin.json keys validated"

      - name: Validate component directories exist
        run: |
          errors=0
          for path in skills/ agents/ .claude/rules/ hooks/hooks.json .mcp.json; do
            if [ ! -e "$path" ]; then
              echo "ERROR: Expected '$path' but it does not exist"
              errors=$((errors + 1))
            else
              echo "OK: $path"
            fi
          done
          if [ $errors -gt 0 ]; then
            exit 1
          fi
          echo "All component directories exist"

      - name: Validate .mcp.json has server entries
        run: |
          count=$(python3 -c "import json; d=json.load(open('.mcp.json')); print(len(d.get('mcpServers',{})))")
          if [ "$count" -eq 0 ]; then
            echo "ERROR: .mcp.json has no MCP server entries"
            exit 1
          fi
          echo ".mcp.json has $count server(s)"

      - name: Validate hooks.json structure
        run: |
          python3 -c "
          import json, sys
          d = json.load(open('hooks/hooks.json'))
          hooks = d.get('hooks', {})
          if not hooks:
              print('ERROR: hooks.json has no hook events')
              sys.exit(1)
          for event, entries in hooks.items():
              for entry in entries:
                  if 'matcher' not in entry:
                      print(f'ERROR: {event} entry missing matcher')
                      sys.exit(1)
                  if 'hooks' not in entry or not entry['hooks']:
                      print(f'ERROR: {event} matcher \"{entry[\"matcher\"]}\" has no hooks')
                      sys.exit(1)
          print('hooks.json structure validated')
          "

  build-mcp:
    name: Build MCP Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore mcp/CWM.RoslynNavigator/CWM.RoslynNavigator.slnx

      - name: Build
        run: dotnet build mcp/CWM.RoslynNavigator/CWM.RoslynNavigator.slnx --no-restore -c Release

  test-mcp:
    # All three OSes: path separators, case sensitivity, and file locking differ, and a
    # Windows-only path bug once shipped because this job ran on Linux alone.
    name: Test MCP Server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-mcp
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore mcp/CWM.RoslynNavigator/tests/CWM.RoslynNavigator.Tests.csproj

      - name: Test
        run: dotnet test mcp/CWM.RoslynNavigator/tests/CWM.RoslynNavigator.Tests.csproj --no-restore -c Release --logger trx --results-directory TestResults

      - name: Publish test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore mcp/CWM.RoslynNavigator/CWM.RoslynNavigator.slnx

      - name: Format check
        run: dotnet format mcp/CWM.RoslynNavigator/CWM.RoslynNavigator.slnx --verify-no-changes --no-restore
